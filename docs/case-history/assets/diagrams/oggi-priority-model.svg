<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<rect width="1600" height="1050" fill="#F7F8F4"/>
<text x="80" y="92" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="46" font-weight="800" fill="#172019">
<tspan x="80" dy="0">Oggi priority model</tspan>
</text>
<text x="82" y="138" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="500" fill="#667064">
<tspan x="82" dy="0">Oggi traduce dominio, tempo e stato in una gerarchia di attenzione.</tspan>
</text>

<rect x="160" y="230" width="1280" height="105" rx="28" fill="#F4DFDD" stroke="#DDE5D9" stroke-width="2"/>
<circle cx="225" cy="282" r="30" fill="#B6463B"/>
<text x="225" y="292" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="800" fill="#fff">
<tspan x="225" dy="0">1</tspan>
</text>
<text x="285" y="275" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="800" fill="#172019">
<tspan x="285" dy="0">Overdue / critical</tspan>
</text>
<text x="285" y="308" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="500" fill="#667064">
<tspan x="285" dy="0">Ciò che richiede azione immediata.</tspan>
</text>
<rect x="160" y="375" width="1280" height="105" rx="28" fill="#DDEDDD" stroke="#DDE5D9" stroke-width="2"/>
<circle cx="225" cy="427" r="30" fill="#2F6F45"/>
<text x="225" y="437" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="800" fill="#fff">
<tspan x="225" dy="0">2</tspan>
</text>
<text x="285" y="420" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="800" fill="#172019">
<tspan x="285" dy="0">Azioni previste oggi</tspan>
</text>
<text x="285" y="453" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="500" fill="#667064">
<tspan x="285" dy="0">Step, rinnovi e gestione pianificati nella giornata.</tspan>
</text>
<rect x="160" y="520" width="1280" height="105" rx="28" fill="#EFF3EA" stroke="#DDE5D9" stroke-width="2"/>
<circle cx="225" cy="572" r="30" fill="#7A8178"/>
<text x="225" y="582" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="800" fill="#fff">
<tspan x="225" dy="0">3</tspan>
</text>
<text x="285" y="565" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="800" fill="#172019">
<tspan x="285" dy="0">Elementi attivi</tspan>
</text>
<text x="285" y="598" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="500" fill="#667064">
<tspan x="285" dy="0">Routine già avviate che devono restare visibili.</tspan>
</text>
<rect x="160" y="665" width="1280" height="105" rx="28" fill="#FFFFFF" stroke="#DDE5D9" stroke-width="2"/>
<circle cx="225" cy="717" r="30" fill="#667064"/>
<text x="225" y="727" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="800" fill="#fff">
<tspan x="225" dy="0">4</tspan>
</text>
<text x="285" y="710" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="800" fill="#172019">
<tspan x="285" dy="0">Prossime azioni future</tspan>
</text>
<text x="285" y="743" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="500" fill="#667064">
<tspan x="285" dy="0">Preview utile senza occupare il centro della pagina.</tspan>
</text>
<rect x="160" y="810" width="1280" height="105" rx="28" fill="#FFFFFF" stroke="#DDE5D9" stroke-width="2"/>
<circle cx="225" cy="862" r="30" fill="#667064"/>
<text x="225" y="872" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="800" fill="#fff">
<tspan x="225" dy="0">5</tspan>
</text>
<text x="285" y="855" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="800" fill="#172019">
<tspan x="285" dy="0">Guide e consigli</tspan>
</text>
<text x="285" y="888" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="500" fill="#667064">
<tspan x="285" dy="0">Supporto quando chiarisce una decisione operativa.</tspan>
</text>
<text x="160" y="955" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="700" fill="#2F6F45">
<tspan x="160" dy="0">Non è solo ordinamento cronologico: è una lista di attenzione.</tspan>
</text>

</svg>